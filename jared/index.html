  <style>
    :root{
      --navy:#0a1424; --navy-soft:#0e1b30; --navy-card:#101e34;
      --orange:#e8743b; --orange-bright:#ff7d2e;
      --ink:#f7fafc; --ink-mute:#9fb0c6; --line:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      font-family:"Inter",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(1100px 520px at 50% -8%, rgba(232,116,59,.16), transparent 60%),
        var(--navy);
      color:var(--ink);
      display:flex; flex-direction:column; align-items:center;
      padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
      min-height:100vh; min-height:100dvh;
    }
    .card{
      width:100%; max-width:420px; margin:auto;
      background:linear-gradient(180deg,var(--navy-card),var(--navy-soft));
      border:1px solid var(--line); border-radius:22px;
      box-shadow:0 24px 60px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
      overflow:hidden;
    }
    /* Brand header */
    .brand{
      display:flex; align-items:center; gap:11px;
      padding:18px 22px; border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.015);
    }
    .brand img{width:43px;height:43px;object-fit:contain;display:block}
    .brand .name{
      font-family:"Outfit",sans-serif; font-weight:800; letter-spacing:.14em;
      font-size:.82rem; color:#fff;
    }
    .brand .name b{color:var(--orange);font-weight:800}
    /* Identity */
    .who{padding:26px 22px 8px;text-align:center}
    .who .logo{
      width:105px;height:105px;margin:0 auto 14px;border-radius:20px;
      background:var(--navy); border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
    }
    .who .logo img{width:78px;height:78px;object-fit:contain}
    .who h1{font-family:"Outfit",sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-.01em;color:#fff}
    .who .role{
      margin-top:6px;color:var(--orange);font-weight:600;font-size:.98rem;
      font-family:"Outfit",sans-serif;letter-spacing:.01em;
    }
    /* Contact rows */
    .rows{padding:18px 18px 6px;display:flex;flex-direction:column;gap:9px}
    .row{
      display:flex;align-items:center;gap:13px;
      padding:13px 15px;border:1px solid var(--line);border-radius:13px;
      background:rgba(255,255,255,.02); color:var(--ink);
      text-decoration:none; transition:border-color .15s ease, background .15s ease, transform .1s ease;
    }
    .row:hover{border-color:rgba(232,116,59,.5);background:rgba(232,116,59,.06)}
    .row:active{transform:scale(.99)}
    .row .ico{
      flex:0 0 auto;width:38px;height:38px;border-radius:10px;
      background:rgba(232,116,59,.13); color:var(--orange);
      display:flex;align-items:center;justify-content:center;
    }
    .row .ico svg{width:19px;height:19px}
    .row .meta{min-width:0}
    .row .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
    .row .val{font-size:.97rem;font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* QR */
    .qrwrap{padding:18px 22px 4px;text-align:center}
    .qrwrap .qrlabel{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-bottom:11px}
    .qrbox{
      width:202px;height:202px;margin:0 auto;background:#fff;border-radius:16px;
      padding:13px; box-shadow:0 12px 30px -14px rgba(0,0,0,.6);
      display:flex;align-items:center;justify-content:center;
    }
    .qrbox canvas{width:100%;height:100%;image-rendering:pixelated;border-radius:4px}
    /* Actions */
    .actions{padding:20px 18px max(20px,env(safe-area-inset-bottom));display:flex;gap:11px}
    .btn{
      flex:1; display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:14px 12px;border-radius:13px;font-family:"Outfit",sans-serif;font-weight:700;
      font-size:.96rem;cursor:pointer;border:1px solid transparent;text-decoration:none;
      transition:transform .12s ease, background .15s ease, border-color .15s ease;
    }
    .btn svg{width:18px;height:18px}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--orange);color:#1a0d02}
    .btn-primary:hover{background:var(--orange-bright)}
    .btn-ghost{background:rgba(255,255,255,.04);color:#fff;border-color:var(--line)}
    .btn-ghost:hover{border-color:rgba(232,116,59,.5);background:rgba(232,116,59,.06)}
    .foot{margin-top:18px;text-align:center;color:var(--ink-mute);font-size:.78rem}
    .foot a{color:var(--ink-mute);text-decoration:none}
    .toast{
      background:#fff;color:var(--navy);font-weight:600;font-size:.9rem;
      padding:11px 18px;border-radius:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
      transform:translateX(-50%) translateY(20px);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>

  <script>
  (function(){
    // ---- Live QR from this card's own URL ----
    var url = location.href.replace(/index\.html?$/,'').replace(/[#?].*$/,'');
    try{
      var qr = qrcodegen.QrCode.encodeText(url, qrcodegen.QrCode.Ecc.MEDIUM);

        try{ await navigator.clipboard.writeText(shareUrl); showToast('Link copied'); }
