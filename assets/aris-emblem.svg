<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c5f78"/>
      <stop offset="55%" stop-color="#374864"/>
      <stop offset="100%" stop-color="#283750"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33425c"/>
      <stop offset="100%" stop-color="#212f45"/>
    </linearGradient>
    <linearGradient id="flameMain" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e0561a"/>
      <stop offset="50%" stop-color="#f7771d"/>
      <stop offset="100%" stop-color="#ff9a38"/>
    </linearGradient>
    <linearGradient id="flameLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff8a2c"/>
      <stop offset="60%" stop-color="#ffac46"/>
      <stop offset="100%" stop-color="#ffce7e"/>
    </linearGradient>
  </defs>

  <!-- house-shield body with white outline -->
  <path d="M 500,118
           L 700,288 L 700,338 L 762,338
           L 762,566 C 762,700 690,802 500,902
           C 310,802 238,700 238,566
           L 238,338 L 300,338 L 300,288 Z"
        fill="url(#body)" stroke="#eef2f7" stroke-width="10" stroke-linejoin="round"/>

  <!-- inner panel / border line -->
  <path d="M 500,170
           L 666,312 L 666,360 L 724,360
           L 724,556 C 724,676 658,768 500,856
           C 342,768 276,676 276,556
           L 276,360 L 334,360 L 334,312 Z"
        fill="url(#panel)"/>
  <path d="M 500,170
           L 666,312 L 666,360 L 724,360
           L 724,556 C 724,676 658,768 500,856
           C 342,768 276,676 276,556
           L 276,360 L 334,360 L 334,312 Z"
        fill="none" stroke="#70859c" stroke-width="6" stroke-linejoin="round"/>

  <!-- ===== flame ===== -->
  <!-- main flame leaf, gently leaning -->
  <path d="M 516,300
           C 470,392 430,452 430,556
           C 430,664 470,742 510,742
           C 590,742 626,672 624,580
           C 622,512 590,470 560,452
           C 612,470 632,430 612,392
           C 600,470 540,440 552,372
           C 556,344 540,318 516,300 Z"
        fill="url(#flameMain)"/>
  <!-- inner lighter flame for depth -->
  <path d="M 506,392
           C 472,460 452,512 456,572
           C 460,648 498,690 524,684
           C 568,672 588,612 580,548
           C 574,492 548,452 506,392 Z"
        fill="url(#flameLight)"/>
  <!-- woven highlight ribbon -->
  <path d="M 470,706 C 452,628 540,604 506,524 C 482,468 540,440 520,388"
        fill="none" stroke="#ffd28a" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
</svg>
