name: ARIS Weekly Insight

# Drafts one Insights post a week and (by default) opens a pull request for
# review. Cron is in UTC. 14:00 UTC Monday = 7:00 AM Pacific / 9:00 AM Central.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "pr = open a pull request for review (default); publish = commit straight to the live site"
        type: choice
        options: [pr, publish]
        default: pr

permissions:
  contents: write
  pull-requests: write

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r insights_gen/requirements.txt

      - name: Generate the draft insight
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set +e
          python -m insights_gen.run
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "Generated a new draft insight."
          elif [ "$code" = "3" ]; then
            echo "Skipped (no ANTHROPIC_API_KEY configured)."
          else
            exit $code
          fi

      - name: Open pull request for review
        if: steps.gen.outputs.generated == 'true' && inputs.mode != 'publish'
        uses: peter-evans/create-pull-request@v6
        with:
          base: gh-pages
          branch: insights/auto-${{ steps.gen.outputs.slug }}
          delete-branch: true
          commit-message: "Insights: ${{ steps.gen.outputs.title }}"
          title: "Insights draft: ${{ steps.gen.outputs.title }}"
          labels: insights, automated
          body: |
            Auto-drafted Insights post for review.

            **Title:** ${{ steps.gen.outputs.title }}
            **File:** `insights/${{ steps.gen.outputs.slug }}.html`

            This was generated by the weekly `insights_gen` pipeline. Review the
            copy and claims, then merge to publish (merging into `gh-pages`
            deploys it). The homepage and hub cards are already updated in this diff.

      - name: Publish directly to the live site
        if: steps.gen.outputs.generated == 'true' && inputs.mode == 'publish'
        run: |
          git config user.name "aris-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Insights: ${{ steps.gen.outputs.title }}"
          git push
